<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Machine Tune-up SOP — Dianmood</title>
<style>
  :root {
    --bg: #0f0f0f; --surface: #1a1a1a; --card: #222;
    --border: #333; --accent: #f5a623; --green: #4caf50;
    --red: #e53935; --text: #eee; --muted: #888;
    --blue: #42a5f5; --teal: #26c6da; --radius: 12px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 15px; padding-bottom: 48px; }
  .header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 20px; }
  .badge { display: inline-block; background: var(--accent); color: #000; font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 6px; margin-bottom: 8px; }
  .header h1 { font-size: 20px; font-weight: 700; }
  .header p { font-size: 13px; color: var(--muted); margin-top: 4px; }
  .empty { text-align: center; padding: 60px 20px; color: var(--muted); font-size: 14px; }
  .empty .icon { font-size: 40px; margin-bottom: 12px; }
  .back-btn { display: inline-block; margin: 20px 20px 0; padding: 10px 18px; background: var(--card); border: 1px solid var(--border); border-radius: 10px; color: var(--text); font-size: 14px; font-weight: 600; text-decoration: none; cursor: pointer; }
</style>
</head>
<body>

<div class="header">
  <div class="badge">知识库</div>
  <h1>Machine Tune-up SOP</h1>
  <p>Dianmood — Calibration, adjustment and performance tuning</p>
</div>

<div class="empty">
  <div class="icon">⚙️</div>
  <div>Content coming soon</div>
  <div style="margin-top:6px;font-size:12px;">SOP under development</div>
</div>

<a class="back-btn" onclick="history.back()">← Back</a>

</body>
</html>
