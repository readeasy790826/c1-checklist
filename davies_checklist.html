<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>C1 Pro Daily Maintenance — Davies</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="checklist-page">

<div class="checklist-header">
  <h1 id="page-title"></h1>
  <p id="page-subtitle"></p>
</div>

<div class="info-bar">
  <div class="session-meta" id="session-meta"></div>
  <input type="hidden" id="location">
  <input type="hidden" id="machine_id">
  <div class="datetime-row">
    <div class="info-group">
      <label>Date</label>
      <input type="date" id="check_date">
    </div>
    <div class="info-group">
      <label>Time</label>
      <input type="time" id="check_time">
    </div>
  </div>
  <div class="quick-actions">
    <button class="quick-btn all" id="btn-select-all">Select All</button>
    <button class="quick-btn clear" id="btn-clear-all">Clear All</button>
  </div>
</div>

<div class="progress-wrap">
  <div class="progress-bar"><div class="progress-fill" id="progress_fill"></div></div>
  <div class="progress-text" id="progress_text"></div>
</div>

<div class="task-list" id="task-list"></div>

<div class="submit-area">
  <button class="submit-btn" id="submit_btn" disabled>Submit Checklist</button>
  <div class="submit-status" id="submit_status"></div>
</div>

<script>window.CHECKLIST_CONFIG = { location: 'Davies', machineId: 'C1-DV-01', frequency: 'daily' };</script>
<script src="checklist.js"></script>
</body>
</html>
